<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qual Animal você seria?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f0f1a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff79c6;
      margin-bottom: 10px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.2rem;
      text-align: center;
    }

    /* Contentor do Cubo 3D */
    .scene {
      width: 180px;
      height: 180px;
      perspective: 600px;
      margin: 20px 0 40px 0;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 12s infinite linear;
      transition: animation 0.3s ease;
    }

    .cube.fast-spin {
      animation: spinFast 0.3s infinite linear !important;
    }

    .cube__face {
      position: absolute;
      width: 180px;
      height: 180px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
      background-color: #1a1a2e;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .cube__face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Posições das 6 faces */
    .cube__face--front  { transform: rotateY(  0deg) translateZ(90px); }
    .cube__face--right  { transform: rotateY( 90deg) translateZ(90px); }
    .cube__face--back   { transform: rotateY(180deg) translateZ(90px); }
    .cube__face--left   { transform: rotateY(-90deg) translateZ(90px); }
    .cube__face--top    { transform: rotateX( 90deg) translateZ(90px); }
    .cube__face--bottom { transform: rotateX(-90deg) translateZ(90px); }

    @keyframes rotateCube {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to   { transform: rotateX(360deg) rotateY(360deg); }
    }

    @keyframes spinFast {
      from { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      to   { transform: rotateX(720deg) rotateY(1080deg) rotateZ(360deg); }
    }

    /* Botão */
    button {
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #ff416c, #8a2be2);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(138, 43, 226, 0.6);
    }

    /* Cartão do Resultado */
    #result-card {
      margin-top: 30px;
      background: #161625;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      width: 260px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .result-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff79c6;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .result-img-container {
      width: 180px;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #ff416c;
      margin-bottom: 15px;
    }

    .result-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="badge">Descubra seu espírito animal</div>
  <h1>Qual Animal você seria?</h1>

  <!-- Cubo 3D -->
  <div class="scene">
    <div class="cube" id="cube">
      <div class="cube__face cube__face--front">
        <img src="https://images.unsplash.com/photo-1540573133985-7585677a328b?auto=format&fit=crop&w=300&q=80" alt="Orangotango">
      </div>
      <div class="cube__face cube__face--back">
        <img src="https://images.unsplash.com/photo-1504450758481-7338bbe7524a?auto=format&fit=crop&w=300&q=80" alt="Calango">
      </div>
      <div class="cube__face cube__face--right">
        <img src="https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=300&q=80" alt="Jacaré">
      </div>
      <div class="cube__face cube__face--left">
        <img src="https://images.unsplash.com/photo-1535591273668-578e31182c4f?auto=format&fit=crop&w=300&q=80" alt="Panda">
      </div>
      <div class="cube__face cube__face--top">
        <img src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=300&q=80" alt="Leão">
      </div>
      <div class="cube__face cube__face--bottom">
        <img src="https://images.unsplash.com/photo-1564349683136-77e08dba1ef9?auto=format&fit=crop&w=300&q=80" alt="Capivara">
      </div>
    </div>
  </div>

  <button id="btn-sortear" onclick="sortearAnimal()">Sortear Novamente</button>

  <!-- Cartão de Resultado -->
  <div id="result-card">
    <div class="result-title">Você seria um(a):</div>
    <div class="result-img-container">
      <img id="result-img" src="" alt="Animal Sorteado">
    </div>
    <div class="result-name" id="result-name"></div>
  </div>

  <script>
    const animais = [
      {
        nome: "Orangotango",
        emoji: "🦧",
        foto: "https://images.unsplash.com/photo-1540573133985-7585677a328b?auto=format&fit=crop&w=500&q=80"
      },
      {
        nome: "Calango",
        emoji: "🦎",
        foto: "https://images.unsplash.com/photo-1504450758481-7338bbe7524a?auto=format&fit=crop&w=500&q=80"
      },
      {
        nome: "Jacaré",
        emoji: "🐊",
        foto: "https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=500&q=80"
      },
      {
        nome: "Saruê",
        emoji: "🐭",
        foto: "https://images.unsplash.com/photo-1612170153139-6f881ff067e0?auto=format&fit=crop&w=500&q=80"
      },
      {
        nome: "Capivara",
        emoji: "🦫",
        foto: "https://images.unsplash.com/photo-1564349683136-77e08dba1ef9?auto=format&fit=crop&w=500&q=80"
      },
      {
        nome: "Leão",
        emoji: "🦁",
        foto: "https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=500&q=80"
      },
      {
        nome: "Panda",
        emoji: "🐼",
        foto: "https://images.unsplash.com/photo-1535591273668-578e31182c4f?auto=format&fit=crop&w=500&q=80"
      },
      {
        nome: "Lobo",
        emoji: "🐺",
        foto: "https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=500&q=80"
      }
    ];

    function sortearAnimal() {
      const cube = document.getElementById('cube');
      const btn = document.getElementById('btn-sortear');
      const resultCard = document.getElementById('result-card');

      btn.disabled = true;
      resultCard.style.display = 'none';
      
      // Inicia giro rápido
      cube.classList.add('fast-spin');

      setTimeout(() => {
        // Para o giro
        cube.classList.remove('fast-spin');
        
        // Sorteia animal
        const sorteado = animais[Math.floor(Math.random() * animais.length)];
        
        // Atualiza cartão
        document.getElementById('result-img').src = sorteado.foto;
        document.getElementById('result-name').textContent = `${sorteado.nome} ${sorteado.emoji}`;
        
        // Exibe cartão
        resultCard.style.display = 'flex';
        btn.disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
